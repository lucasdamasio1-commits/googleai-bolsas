# Configuração Nginx para Cadê Bolsa (www.cadebolsa.com.br)
# Arquivo: /etc/nginx/sites-available/cadebolsa.com.br

server {
    listen 80;
    listen [::]:80;
    server_name cadebolsa.com.br www.cadebolsa.com.br;

    # Redirecionamento automático HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cadebolsa.com.br www.cadebolsa.com.br;

    # Certificados SSL gerenciados pelo Certbot (Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/cadebolsa.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cadebolsa.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Compactação Gzip para alto desempenho em dispositivos móveis
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
